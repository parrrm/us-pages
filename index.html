     <div class="duo">${["a","b"].map(x=>`<button class="who" data-act="reclaim" data-seat="${x}"><div class="av">${esc(ss[x].av)}</div><b>${esc(ss[x].name)}</b></button>`).join("")}</div></div>`);
  if(!S.seat||S.editing||!(ss[S.seat]||{}).g){ const me=S.seat?ss[S.seat]:null; if(mounted!=="profile"){ S.av=(me&&me.av)||AVATARS[ss.a?1:0]; S.pg=(me&&me.g)||null; S.pw=Object.assign({},(me&&me.w)||{}); }
    const W=S.pg?WORDS[S.pg]:null, wrow=(k,lab)=>`<div class="wrow"><small>${lab}</small><div class="tls z3">${W[k].map(x=>`<button class="tl ${S.pw[k]===x?"on":""}" data-act="pw" data-k="${k}" data-v="${x}">${x}</button>`).join("")}</div></div>`;
    return mount("profile",`${head(`${backBtn}`,`<span class="brand">US</span>${badge()}`)}<div class="center prof"><h2>Who's playing?</h2>
     <input class="field" id="name" data-keep maxlength="14" placeholder="Your name" autocomplete="off" value="${esc((me&&me.name)||LS.get("us.name")||"")}">
     <div class="avs">${AVATARS.map(a=>`<button data-act="av" data-av="${a}" class="${a===S.av?"sel":""}">${a}</button>`).join("")}</div>
     <div class="two"><button class="btn small ${S.pg==="f"?"on":""}" data-act="pg" data-v="f">I'm a woman</button><button class="btn small ${S.pg==="m"?"on":""}" data-act="pg" data-v="m">I'm a man</button></div>
     ${W?`<div class="words"><h3>Your words <span>optional</span></h3><p class="note">The games use these when they talk about you.</p>
       ${wrow("p","Between your legs")}${W.c.length>1?wrow("c","Your chest"):""}
       <input class="field left" id="nick" data-keep maxlength="16" placeholder="What you like to be called (optional)" autocomplete="off" value="${esc((me&&me.nick)||"")}"></div>`:""}
     <button class="btn primary" data-act="saveprofile" ${S.pg?"":"disabled"}>${S.seat?"Save":"Enter"}</button></div>`); }
  const me=ss[S.seat], o=ss[other()], pres=S.pub.presence||{}, oOn=!!pres[other()];
  const s=sess(); let html;
  if(s&&s.game==="samebrain"&&s.plan&&typeof s.plan[0]!=="object") html=renderSameBrain(s,me,o,oOn);
  else if(s&&s.game==="thief"&&s.plan) html=renderThief(s,me,o,oOn);
  else if(s&&s.game==="afterdark") html=renderAfterDark(s,me,o);
  else if(!s&&S.view==="vault"&&S.env==="s") html=renderVault();
  else if(s){ html=`${head(`<button class="icon" data-act="end">‹</button>`)}<div class="center"><p>This game isn't available yet.</p></div>`; }
  else html=`${head(`<span class="brand">US</span>${badge()}`,`<button class="icon" data-act="sheet" aria-label="Menu">⋯</button>`)}
    <div class="duo"><div class="who"><div class="av on">${esc(me.av)}<i class="dot"></i></div><b>${esc(me.name)}</b><small>you</small></div><div class="amp">&amp;</div>
    ${o?`<div class="who"><div class="av ${oOn?"on":"off"}">${esc(o.av)}<i class="dot"></i></div><b>${esc(o.name)}</b><small>${oOn?"here":"away"}</small></div>`
       :`<button class="who" data-act="share"><div class="av off">＋</div><b>Invite</b><small>send the link</small></button>`}</div>
    ${curEvent()?`<div class="evbar"><b>★ Tonight: ${EVENTS[curEvent()][0]}</b><br>${EVENTS[curEvent()][1]}</div>`:""}
    <div class="grid">${GAMES.filter(g=>!g.sandboxOnly||S.env==="s").map(g=>`<button class="planet ${g.ready?"":"soon"}" data-act="launch" data-game="${g.id}" style="--c1:${g.c1};--c2:${g.c2}">
       <div class="orb">${g.g}</div><b>${g.name}</b><small>${g.tag}</small>${g.id==="samebrain"&&(S.pub.paused||{}).samebrain?`<span class="tag ev">Continue ${S.pub.paused.samebrain.n+1} / ${S.pub.paused.samebrain.plan.length}</span>`:g.ready?(S.pub.stats&&S.pub.stats[g.id]&&S.pub.stats[g.id].bestScore?`<span class="tag">Best ${S.pub.stats[g.id].bestScore}</span>`:""):`<span class="tag">Soon</span>`}</button>`).join("")}</div>
    ${S.env==="s"?`<button class="btn" style="margin-top:14px" data-act="vault">🗝 Vault · test view</button>`:""}
    ${S.env==="s"&&!o?`<button class="btn" style="margin-top:10px" data-act="addbot">🤖 Add a test player</button>`:""}`;
  if(S.sbAsk&&!s) html+=`<div class="sheetbg" data-act="sbaskclose"><div class="sheet"><p style="text-align:center">You paused a game of Same Brain.</p><button class="btn primary" data-act="sbresume">Continue where we stopped</button><button class="btn" data-act="sbnew">Start a new game</button><button class="link" data-act="sbaskclose">Cancel</button></div></div>`;
  if(S.sheet){ const sig=Object.keys(S.pub.signals||{}).length;
    html+=`<div class="sheetbg" data-act="closesheet"><div class="sheet">
      <button class="btn" data-act="share">Share invite link</button><button class="btn" data-act="edit">Edit my profile</button>
      ${S.env==="s"?`<p class="note" style="text-align:center">Sandbox · ${sig} signal${sig===1?"":"s"} stored</p>${o&&o.bot?`<button class="btn" data-act="mirror">Test player: ${{real:"answers like a partner",mirror:"copies my picks",random:"picks at random"}[LS.get("us.bot.mode")||"real"]} · tap to change</button><button class="btn" data-act="rmbot">Remove test player</button>`:!o?`<button class="btn" data-act="addbot">🤖 Add a test player</button>`:""}`:""}
      ${S.env==="s"?`<button class="btn" data-act="evnext">Tonight's event: ${curEvent()?EVENTS[curEvent()][0]:"none"} · tap to change</button>`:""}
      <button class="btn danger" data-act="fresh">Start fresh</button>
      <button class="link" data-act="closesheet">Close</button></div></div>`; }
  mount("main",html);
}
/* ---------- input ---------- */
const SLOW=new Set(["sblock","sbnext","sbfu","sbpause","sbresume","sbnew","mtnext","mtlock","rematch","launch","endyes","freshyes","addbot","create","saveprofile"]), tapAt={};
document.addEventListener("click",e=>{
  const el=e.target.closest("[data-act]"); if(!el) return; const a=el.dataset.act;
  if(SLOW.has(a)){ const t=Date.now(), k=a+(el.dataset.game||""); if(tapAt[k]&&t-tapAt[k]<900) return; tapAt[k]=t; }
  if((a==="closesheet"||a==="cancelend"||a==="cancelfresh"||a==="sbaskclose")&&e.target.closest(".sheet")&&!e.target.closest("button")) return;
  ({ reload:()=>location.reload(),
     create:()=>create(el.dataset.env),
     leave:leaveUniverse,
     reclaim:()=>reclaim(el.dataset.seat),
     av:()=>{ S.av=el.dataset.av; document.querySelectorAll(".avs button").forEach(b=>b.classList.toggle("sel",b.dataset.av===S.av)); },
     pg:()=>{ if(S.pg!==el.dataset.v) S.pw={}; S.pg=el.dataset.v; S.reprof=true; render(); },
     pw:()=>{ const k=el.dataset.k; S.pw[k]=S.pw[k]===el.dataset.v?null:el.dataset.v; S.reprof=true; render(); },
     saveprofile:()=>saveProfile($("#name").value,S.av),
     launch:()=>{ if(el.dataset.game==="samebrain"&&(S.pub.paused||{}).samebrain){ S.sbAsk=true; return render(); } launch(el.dataset.game); },
     sheet:()=>{S.sheet=true;render()}, closesheet:()=>{S.sheet=false;render()},
     edit:()=>{S.sheet=false;S.draftName=null;S.editing=true;render()},
     share:()=>{ const url=inviteURL(); S.sheet=false; render();
       if(navigator.share) navigator.share({title:"US",url}).catch(()=>{}); else if(navigator.clipboard) navigator.clipboard.writeText(url).then(()=>toast("Link copied")); },
     addbot:()=>{ S.sheet=false; Bot.start(); render(); }, rmbot:()=>{ S.sheet=false; Bot.stop(); },
     fresh:()=>{ S.sheet=false; S.confirmFresh=true; render(); }, cancelfresh:()=>{ S.confirmFresh=false; render(); }, freshyes:startFresh,
     back:()=>{ if(S.editing){ S.editing=false; S.draftName=null; render(); } else startFresh(); },
     sbo:()=>{ const w=el.dataset.w, raw=el.dataset.v, v=/^\d+$/.test(raw)?+raw:raw; S.sb[w]=v; render(); if(w==="a"&&v==="x") setTimeout(()=>{ const e=$("#sbt"); if(e) e.focus(); },0); },
     sbm:()=>{ const w=el.dataset.w, raw=el.dataset.v, v=/^\d+$/.test(raw)?+raw:raw, a=S.sb[w], k=a.indexOf(v); if(k>=0) a.splice(k,1); else a.push(v); render(); if(w==="a"&&v==="x"&&k<0) setTimeout(()=>{ const e=$("#sbt"); if(e) e.focus(); },0); },
     sbr:()=>{ const a=S.sb[el.dataset.w], v=+el.dataset.v, k=a.indexOf(v); if(k>=0) a.splice(k,1); else a.push(v); render(); },
     sbb:()=>{ S.sb.a[+el.dataset.i]=+el.dataset.v; render(); },
     sblock:sbLock, sbnext:()=>{ const s=sess(); if(s) sref(ME,"n").set(s.n+1); },
     sbkeep:()=>{ const s=sess(), cur=((s.kept||{})[s.n]||{})[S.seat], d=sbAt(s,s.n); sref(ME,"kept/"+s.n+"/"+S.seat).set(cur?null:true);
       if(d&&(((S.pub.prefs||{})[sbKey(d)])||{})[s.sid]) pub.child("prefs/"+sbKey(d)+"/"+s.sid+"/kept/"+S.seat).set(cur?null:true);
       const fu=((s.fu||{})[s.n]); if(d&&fu&&!cur) pub.child("prefs/"+sbKey(d)+"/"+s.sid+"/fu").set(fu); },
     sbfu:()=>{ const s=sess(), n=s.n, d=sbAt(s,n), rows=sbRows(s), row=rows[n]; if(!row) return; const q=sbFollow(d,row,s)[+el.dataset.i]; if(!q) return;
       sref(ME,"fu/"+n).set({by:S.seat,q}); const kp=(s.kept||{})[n]; if(kp&&Object.values(kp).some(Boolean)) pub.child("prefs/"+sbKey(d)+"/"+s.sid+"/fu").set({by:S.seat,q}); },
     sbj:()=>{ const s=sess(); sref(ME,"j/"+s.n+"/"+S.seat).set(el.dataset.v==="1"); },
     sbpause:()=>{ const s=sess(); S.confirmEnd=false; if(s) pub.child("paused/samebrain").set(s).then(()=>endSession()); },
     sbresume:()=>{ const pz=(S.pub.paused||{}).samebrain; S.sbAsk=false; if(pz){ pub.child("session").set(Object.assign({},pz,{host:S.seat})); pub.child("paused/samebrain").remove(); wake(); } },
     sbnew:()=>{ S.sbAsk=false; pub.child("paused/samebrain").remove().then(()=>launch("samebrain")); }, sbaskclose:()=>{ S.sbAsk=false; render(); },
     rematch:()=>{ const s=sess(); launch(s?s.game:"samebrain"); },
     vault:()=>{S.view="vault";render()}, vaultclose:()=>{S.view=null;render()},
     mtnext:()=>{ const s=sess(); sref(ME,"n").set(s.n+1); },
     mta:()=>{ S.mt.a=+el.dataset.v; render(); }, mtst:()=>{ S.mt.st=+el.dataset.v; render(); }, mtlock:mtLock,
     mtp:()=>{ const v=+el.dataset.v, a=S.mt.p, k=a.indexOf(v); if(k>=0) a.splice(k,1); else { if(a.length>=2) a.shift(); a.push(v); } render(); },
     evnext:()=>{ const ids=["none"].concat(Object.keys(EVENTS)), cur=curEvent()||"none"; pub.child("event").set({day:today(),id:ids[(ids.indexOf(cur)+1)%ids.length]}); },
     adgo:()=>{ try{ const f=JSON.parse(localStorage.getItem("ad-form")||"{}")||{}; f.n=(seats()[S.seat]||{}).name||f.n||""; localStorage.setItem("ad-form",JSON.stringify(f)); localStorage.setItem("us.return",location.href); }catch(e){} },
     mirror:()=>{ const m=["real","mirror","random"], c=LS.get("us.bot.mode")||"real"; LS.set("us.bot.mode",m[(m.indexOf(c)+1)%3]); render(); },
     end:()=>{ const s=sess(); if(s&&!gameOver(s)){S.confirmEnd=true;render()} else endSession(); },
     endyes:endSession, cancelend:()=>{S.confirmEnd=false;render()}
  }[a]||(()=>{}))();
});
document.addEventListener("input",e=>{ const t=e.target, st=S.sb; if(!st) return;
  if(t.classList.contains("range")){ st[t.dataset.w]=+t.value; const s0=sess(), d0=s0&&s0.plan?sbAt(s0,s0.n):null, lab=document.querySelector(`[data-sv="${t.dataset.w}"]`);
    if(d0&&lab) lab.textContent=sbStep(d0,+t.value); const tk=t.parentNode.querySelectorAll(".ticks i"); tk.forEach((e,i)=>e.classList.toggle("on",i===Math.round(t.value/25))); }
  else { const f={sbt:"t",sbl:"t",sbln:"ln",sbg:"g"}[t.id]; if(!f) return; st[f]=t.value; }
  const s=sess(), d=s&&s.plan?sbAt(s,s.n):null, b=$('[data-act="sblock"]'); if(b&&d) b.disabled=!sbReady(d,st); });
document.addEventListener("pointerdown",e=>{ if(e.target.classList&&e.target.classList.contains("range")) S.dragging=true; });
["pointerup","pointercancel","touchend"].forEach(ev=>document.addEventListener(ev,()=>{ if(S.dragging){ S.dragging=false; render(); } }));
boot();
</script>
