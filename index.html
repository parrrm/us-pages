function heFold(s){ const sc={a:0,b:0}, rows=[];

/* ====================== per-game reactions (run on every state change and once a second) ====================== */
function reactGames(s){
  if(s.game==="chaos"){
    if(!((s.drops||{})[S.seat])&&first("drop"+s.sid)){ const mine=shuffle(Object.values(S.privVault||{}).filter(m=>m.kind==="dare").map(m=>m.title)).slice(0,2); if(mine.length) sref(ME,"drops/"+S.seat).set(mine); }
    const used=((s.dropUsed||{})[S.seat])||{}, dr=((s.drops||{})[S.seat])||[];
    for(const di in used) if(dr[di]!=null&&first("mig"+s.sid+di)){ const hit=Object.entries(S.privVault||{}).find(([id,m])=>m.kind==="dare"&&m.title===dr[di]);
      if(hit){ pub.child("vault/"+hit[0]).set({title:dr[di],kind:"dare",by:S.seat,t:TS}); priv.child("vault/"+hit[0]).remove(); } }
    if((s.tn||0)>=CH_TURNS){ const bank=Object.assign({a:0,b:0},s.bank); saveStats("chaos",s,Math.max(bank.a,bank.b)); signalOnce(s,s.sid,"chaos",{bank,bc:s.bc||{}}); } }
  else if(s.game==="undercover"){ const sec=secOf(s,"uc"), c=sec.commit||{}, rv=sec.reveal||{}, key=s.sid+"uc";
    if(!c[S.seat]){ if(first("ucs"+s.sid)) ucSetup(ME,s); } else { secLoadMine(s,"uc"); if(!(s.lineup||{})[S.seat]&&S.sec[key]&&first("ucl"+s.sid)) ucLineup(ME,S.sec[key].m); }
    if(ucOver(s)&&c[S.seat]&&!rv[S.seat]&&first("ucr"+s.sid)) priv.child("ucdone").once("value").then(x=>{ const d=x.val(); return sref(ME,"done/"+S.seat).set(!!(d&&d.sid===s.sid&&d.done)); }).then(()=>secReveal(ME,s,"uc"));
    if(rv.a&&rv.b){ const r=ucScore(s); saveStats("undercover",s,Math.max(r.a.pts,r.b.pts)); signalOnce(s,s.sid,"undercover",r); } }
  else if(s.game==="heist"){ const n=s.n; if(n>=HE_ROUNDS){ const f=heFold(s); saveStats("heist",s,Math.max(f.sc.a,f.sc.b)); return; }
    const r=heRound(s,n), k=heKeeper(s,n), key=s.sid+"_"+n;
    if(k===S.seat){ if(!r.clues&&(!S.hd||S.hd.key!==key)){ S.hd=heDraft(null,s.ev==="open"?3:4); if(S.hd) S.hd.key=key; }
      if(r.guess&&!revealed(s,"h"+n,k)&&first("her"+key)) secReveal(ME,s,"h"+n); }
    else if(!S.hg||S.hg.key!==key) S.hg={key,m:null,lie:null};
    const rev=revealed(s,"h"+n,k); if(r.guess&&rev) signalOnce(s,key,"heist",{title:r.titles[rev.target],clues:r.clues,lie:rev.lie,found:r.guess.m===rev.target,spotted:r.guess.lie===rev.lie}); }
}

    ${curEvent()?`<div class="evbar"><b>★ Tonight: ${EVENTS[curEvent()][0]}</b><br>${EVENTS[curEvent()][1]}</div>`:""}
    <div class="grid">${GAMES.filter(g=>!g.sandboxOnly||S.env==="s").map(g=>`<button class="planet ${g.ready?"":"soon"}" data-act="launch" data-game="${g.id}" style="--c1:${g.c1};--c2:${g.c2}">
       <div class="orb">${g.g}</div><b>${g.name}</b><small>${g.tag}</small>${g.ready?(S.pub.stats&&S.pub.stats[g.id]&&S.pub.stats[g.id].bestScore?`<span class="tag">Best ${S.pub.stats[g.id].bestScore}</span>`:""):`<span class="tag">Soon</span>`}</button>`).join("")}</div>
    <button class="btn" style="margin-top:14px" data-act="vault">🗝 Vault · ${sharedVault().length} shared memor${sharedVault().length===1?"y":"ies"}</button>
    ${S.env==="s"&&!o?`<button class="btn" style="margin-top:10px" data-act="addbot">🤖 Add a test player</button>`:""}`;
  if(S.sheet){ const sig=Object.keys(S.pub.signals||{}).length;
    html+=`<div class="sheetbg" data-act="closesheet"><div class="sheet">
      <button class="btn" data-act="share">Share invite link</button><button class="btn" data-act="edit">Edit my profile</button>
      ${S.env==="s"?`<p class="note" style="text-align:center">Sandbox · ${sig} signal${sig===1?"":"s"} stored</p>${o&&o.bot?`<button class="btn" data-act="mirror">Test player: ${LS.get("us.bot.mirror")?"copies my picks":"picks at random"}</button><button class="btn" data-act="rmbot">Remove test player</button>`:!o?`<button class="btn" data-act="addbot">🤖 Add a test player</button>`:""}`:""}
      ${S.env==="s"?`<button class="btn" data-act="evnext">Tonight's event: ${curEvent()?EVENTS[curEvent()][0]:"none"} · tap to change</button>`:""}
      <button class="btn danger" data-act="fresh">Start fresh</button>
      <button class="link" data-act="closesheet">Close</button></div></div>`; }
  mount("main",html);
}
function renderSameBrain(s,me,o,oOn){
  const f=sbFold(s), on=o?esc(o.name):"your partner", total=s.plan.length, st=(S.pub.stats&&S.pub.stats.samebrain)||{};
  const top=head(`<button class="icon" data-act="end" aria-label="Back to lobby">‹</button>`,`<span class="tag">${Math.min(s.n+1,total)} / ${total}</span>${badge()}`);
  const hud=`<div class="hud"><div><small>Sync score</small><b>${f.score}</b></div><div><small>Streak</small><b>${f.streak?"🔥 "+f.streak:"–"}</b></div></div>`;
  const endSheet=S.confirmEnd?`<div class="sheetbg" data-act="cancelend"><div class="sheet"><p style="text-align:center">Leave this game for both of you?</p><button class="btn danger" data-act="endyes">Back to lobby</button><button class="link" data-act="cancelend">Keep playing</button></div></div>`:"";
  let body;
  if(s.n>=total){
    const title=f.avg>=80?"One brain, two bodies":f.avg>=60?"Finishing each other's sentences":f.avg>=40?"Same wavelength, some static":f.avg>=20?"Different channels tonight":"Opposites attract";
    const pb=st.lastSid===s.sid&&st.games>1&&f.score>(st.prevBest||0);
    body=`<div class="sub">Same Brain</div><div class="logo" style="font-size:72px;letter-spacing:-2px">${f.score}</div><div class="big">${title}</div>
      <p>Best streak ${f.best?"🔥 "+f.best:"–"} · ${f.rows.filter(x=>x.sync).length} of ${total} in sync</p>
      ${pb?`<p style="color:var(--amber)">★ New best for the two of you</p>`:st.bestScore?`<p class="note">Your best together: ${Math.max(st.bestScore,f.score)}</p>`:""}
      <button class="btn primary" data-act="rematch">Play again</button><button class="btn" data-act="endyes">Back to lobby</button>`;
    return top+`<div class="center">${body}</div>`;
  }
  const p=s.plan[s.n], d=SB[p.f][p.i], r=curRound(s), c=r.commit||{}, v=r.reveal||{}, key=s.sid+"_"+s.n;
  const title=`<div class="fmt">${SB_NAMES[p.f]}${p.x2?`<span class="x2">Double ×2</span>`:""}</div><h2>${esc(d.q)}</h2>`;
  if(v.a&&v.b){
    const x=f.rows[s.n], mine=JSON.parse(v[S.seat].v), theirs=JSON.parse(v[other()].v), ok=S.verified[key]; let show;
    if(p.f==="snap"){ const a=opt(d.o[mine]), b=opt(d.o[theirs]);
      show=`<div class="pair"><div class="pick"><span>${a.e}</span><b>${esc(a.l)}</b><small>${esc(me.name)}</small></div><div class="pick"><span>${b.e}</span><b>${esc(b.l)}</b><small>${on}</small></div></div>`; }
    else if(p.f==="mid") show=`<div class="trackwrap"><div class="track"><i style="left:${mine}%">${esc(me.av)}</i><i style="left:${theirs}%">${o?esc(o.av):"?"}</i></div>
      <div class="poles"><span>${esc(d.l)}</span><span>${esc(d.r)}</span></div></div><p>${x.d===0?"Exactly the same spot":x.d+" apart"}</p>`;
    else show=`<div class="cols"><div><small>${esc(me.name)}</small>${mine.map((it,k)=>`<div class="row ${it===theirs[k]?"hit":""}"><i>${k+1}</i>${esc(d.o[it])}</div>`).join("")}</div>
      <div><small>${on}</small>${theirs.map((it,k)=>`<div class="row ${it===mine[k]?"hit":""}"><i>${k+1}</i>${esc(d.o[it])}</div>`).join("")}</div></div>`;
    body=`${title}<div class="big ${x.sync?"yes":"no"}">${x.sync?"Same brain!":x.pts>=50?"So close":"Not this time"}</div>${show}
      <div class="pts">+${x.total}</div><p class="note">${x.pts} points${x.bonus?" · streak bonus +"+x.bonus:""}${p.x2?" · doubled":""}${ok===false?" · ✕ a pick changed after locking":ok===true?" · ✓ locked before reveal":""}</p>
      <button class="btn primary" data-act="next">${s.n+1<total?"Next round":"See results"}</button>`;
  }
  else if(c[S.seat]) body=`${title}<div class="big">Locked in ✓</div><p class="pulse">${c[other()]?"Revealing…":"Waiting for "+on+(oOn?"":" (away)")}</p>`;
  else{ let ui, ready=true;
    if(p.f==="snap"){ ready=S.sel!=null; ui=`<div class="snap">${d.o.map((str,i)=>{ const x=opt(str); return `<button class="opt ${S.sel===i?"sel":""} ${x.l?"":"solo"}" data-act="sel" data-v="${i}"><span>${x.e}</span>${x.l?`<small>${esc(x.l)}</small>`:""}</button>`; }).join("")}</div>`; }
    else if(p.f==="mid") ui=`<div class="trackwrap"><input type="range" id="mid" class="range" min="0" max="100" step="1" value="${S.sel==null?50:S.sel}"><div class="poles"><span>${esc(d.l)}</span><span>${esc(d.r)}</span></div></div>`;
    else{ const sel=S.sel||[]; ready=sel.length===4; ui=`<div class="rk">${d.o.map((t,i)=>{ const k=sel.indexOf(i); return `<button class="rki ${k>=0?"sel":""}" data-act="rk" data-v="${i}"><i>${k>=0?k+1:""}</i>${esc(t)}</button>`; }).join("")}</div><p class="note">Tap them in order, first to last. Tap again to undo.</p>`; }
    body=`${title}${ui}<p class="note">${c[other()]?on+" has locked in":"No talking until the reveal 🤫"}</p><button class="btn primary" data-act="lock" ${ready?"":"disabled"}>Lock in</button>`; }
  return top+hud+`<div class="center game">${body}</div>`+endSheet;
}

/* ---------- input ---------- */
const SLOW=new Set(["chpress","chcash","chpass","chyes","chno","chcaught","lock","next","henext","mtnext","hdlock","hglock","mtlock","rematch","launch","ucguess","vsample","endyes","freshyes","addbot","create","saveprofile"]), tapAt={};
document.addEventListener("click",e=>{
  const el=e.target.closest("[data-act]"); if(!el) return; const a=el.dataset.act;
  if(SLOW.has(a)){ const t=Date.now(); if(tapAt[a]&&t-tapAt[a]<900) return; tapAt[a]=t; }
  if((a==="closesheet"||a==="cancelend"||a==="cancelfresh"||a==="ucclose")&&e.target.closest(".sheet")&&!e.target.closest("button")) return;
  ({ reload:()=>location.reload(),
     create:()=>create(el.dataset.env),
     leave:leaveUniverse,
     reclaim:()=>reclaim(el.dataset.seat),
     av:()=>{ S.av=el.dataset.av; document.querySelectorAll(".avs button").forEach(b=>b.classList.toggle("sel",b.dataset.av===S.av)); },
     saveprofile:()=>saveProfile($("#name").value,S.av),
     launch:()=>launch(el.dataset.game),
     sheet:()=>{S.sheet=true;render()}, closesheet:()=>{S.sheet=false;render()},
     edit:()=>{S.sheet=false;S.draftName=null;S.editing=true;render()},
     share:()=>{ const url=inviteURL(); S.sheet=false; render();
       if(navigator.share) navigator.share({title:"US",url}).catch(()=>{}); else if(navigator.clipboard) navigator.clipboard.writeText(url).then(()=>toast("Link copied")); },
     addbot:()=>{ S.sheet=false; Bot.start(); render(); }, rmbot:()=>{ S.sheet=false; Bot.stop(); },
     fresh:()=>{ S.sheet=false; S.confirmFresh=true; render(); }, cancelfresh:()=>{ S.confirmFresh=false; render(); }, freshyes:startFresh,
     back:()=>{ if(S.editing){ S.editing=false; S.draftName=null; render(); } else startFresh(); },
     sel:()=>{ S.sel=+el.dataset.v; render(); },
     rk:()=>{ const v=+el.dataset.v, a=(S.sel||[]).slice(), k=a.indexOf(v); if(k>=0) a.splice(k,1); else a.push(v); S.sel=a; render(); },
     lock:lockIn, next:nextRound, rematch:()=>{ const s=sess(); launch(s?s.game:"samebrain"); },
     chpress:()=>chPress(ME,sess()), chcash:()=>chPass(ME,sess(),true), chpass:()=>chPass(ME,sess(),false), chyes:()=>chJudge(ME,sess(),true), chno:()=>chJudge(ME,sess(),false), chcaught:()=>chCaught(ME,sess()), chskip:()=>chSkip(ME,sess()),
     ucdone:()=>ucSetDone(!S.ucDone[sess().sid]), ucsheet:()=>{S.ucSheet=true;render()}, ucclose:()=>{S.ucSheet=false;render()},
     ucguess:()=>{ const s=sess(), g=((s.guess||{})[S.seat]||[]); S.ucSheet=false; if(g.length<ucMax(s)) sref(ME,"guess/"+S.seat).set(g.concat(+el.dataset.v)); render(); },
     ucend:()=>{ if(S.ucEnd){ S.ucEnd=false; sref(ME,"ended").set(true); } else { S.ucEnd=true; render(); } },
     vault:()=>{S.view="vault";render()}, vaultclose:()=>{S.view=null;S.vDel=null;render()}, vshared:()=>{S.vPriv=false;render()}, vpriv:()=>{S.vPriv=true;render()}, vadd:vaultAdd,
     vdel:()=>{ const id=el.dataset.id; if(S.vDel===id){ S.vDel=null; pub.child("vault/"+id).remove(); } else { S.vDel=id; render(); } },
     vdelp:()=>{ const id=el.dataset.id; if(S.vDel===id){ S.vDel=null; priv.child("vault/"+id).remove(); } else { S.vDel=id; render(); } },
     vsample:()=>{ const u={}; VAULT_SAMPLES.forEach((t,i)=>{ u[rid(10)]={title:t,by:i%2?"a":"b",t:Date.now()-i*1000}; }); pub.child("vault").update(u); },
     hd:()=>{ S.hd[el.dataset.f]=+el.dataset.v; render(); }, hdlie:()=>{ S.hd.lie=+el.dataset.v; render(); },
     hdswap:()=>{ const k=S.hd.key; S.hd=heDraft(null,sess().ev==="open"?3:4); if(S.hd) S.hd.key=k; render(); }, hdlock:()=>heLock(ME,sess(),sess().n,S.hd),
     hglie:()=>{ S.hg.lie=+el.dataset.v; render(); }, hgm:()=>{ S.hg.m=el.dataset.id; render(); },
     hglock:()=>{ const s=sess(); if(S.hg.m!=null&&S.hg.lie!=null) sref(ME,"r/"+s.n+"/guess").set({m:S.hg.m,lie:S.hg.lie}); },
     henext:()=>{ const s=sess(); sref(ME,"n").set(s.n+1); }, mtnext:()=>{ const s=sess(); sref(ME,"n").set(s.n+1); },
     mta:()=>{ S.mt.a=+el.dataset.v; render(); }, mtst:()=>{ S.mt.st=+el.dataset.v; render(); }, mtlock:mtLock,
     mtp:()=>{ const v=+el.dataset.v, a=S.mt.p, k=a.indexOf(v); if(k>=0) a.splice(k,1); else { if(a.length>=2) a.shift(); a.push(v); } render(); },
     vmem:()=>{S.vKind="mem";render()}, vdare:()=>{S.vKind="dare";render()},
     evnext:()=>{ const ids=["none"].concat(Object.keys(EVENTS)), cur=curEvent()||"none"; pub.child("event").set({day:today(),id:ids[(ids.indexOf(cur)+1)%ids.length]}); },
     adgo:()=>{ try{ const f=JSON.parse(localStorage.getItem("ad-form")||"{}")||{}; f.n=(seats()[S.seat]||{}).name||f.n||""; localStorage.setItem("ad-form",JSON.stringify(f)); localStorage.setItem("us.return",location.href); }catch(e){} },
     mirror:()=>{ LS.set("us.bot.mirror",LS.get("us.bot.mirror")?0:1); render(); },
     end:()=>{ const s=sess(); if(s&&!gameOver(s)){S.confirmEnd=true;render()} else endSession(); },
     endyes:endSession, cancelend:()=>{S.confirmEnd=false;render()}
  }[a]||(()=>{}))();
});
document.addEventListener("input",e=>{ if(e.target.id==="mid") S.sel=+e.target.value; });
document.addEventListener("pointerdown",e=>{ if(e.target.id==="mid") S.dragging=true; });
["pointerup","pointercancel","touchend"].forEach(ev=>document.addEventListener(ev,()=>{ if(S.dragging){ S.dragging=false; render(); } }));
boot();
</script>
