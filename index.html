/* ---------- session (host launches, partner follows) ---------- */
function sbPlan(){
  const seen=(S.pub.seen&&S.pub.seen.samebrain)||{}, pickd={}, newSeen={};
  for(const f of ["snap","mid","rank"]){ let used=(seen[f]||[]).filter(i=>i<SB[f].length), pool=SB[f].map((_,i)=>i).filter(i=>!used.includes(i));
    if(pool.length<3){ used=[]; pool=SB[f].map((_,i)=>i); } pickd[f]=shuffle(pool).slice(0,3); newSeen[f]=used.concat(pickd[f]); }
  const plan=[]; for(let k=0;k<3;k++) for(const f of ["snap","mid","rank"]) plan.push({f,i:pickd[f][k]});
  shuffle([2,3,4,5,6,7,8]).slice(0,2).forEach(x=>{ plan[x].x2=true; });
  return {plan,newSeen};
}
function launch(gid){
  const g=GAMES.find(x=>x.id===gid); if(!g||!g.ready) return toast(g?g.name+" is coming soon":"");
  const base={game:gid,host:S.seat,sid:rid(8),t:TS,n:0};
  if(gid==="samebrain"){ const x=sbPlan(); base.plan=x.plan; pub.child("seen/samebrain").set(x.newSeen); }
  pub.child("session").set(base); wake();
}
function endSession(){ S.confirmEnd=false; pub.child("session").remove(); if(wakeLock){ try{wakeLock.release()}catch(e){} wakeLock=null; } }

/* ---------- Same Brain scoring: derived from the reveal history, so both phones always agree ---------- */
function sbScore(p,a,b){
  if(p.f==="snap") return {pts:a===b?100:0,sync:a===b};
  if(p.f==="mid"){ const d=Math.abs(a-b); return {pts:Math.max(0,100-2*d),sync:d<=15,d}; }
  let m=0; for(let k=0;k<4;k++) if(a[k]===b[k]) m++; return {pts:25*m,sync:m===4,m};
}
function sbFold(s){
  let score=0,streak=0,best=0,base=0; const rows=[];
  for(let n=0;n<s.plan.length;n++){ const r=(s.rounds||{})[n], v=r&&r.reveal; if(!v||!v.a||!v.b) break;
    const p=s.plan[n], x=sbScore(p,JSON.parse(v.a.v),JSON.parse(v.b.v)); streak=x.sync?streak+1:0; best=Math.max(best,streak);
    const bonus=x.sync?Math.min(100,20*(streak-1)):0, total=(x.pts+bonus)*(p.x2?2:1); score+=total; base+=x.pts; rows.push(Object.assign(x,{bonus,total,streak})); }
  return {score,streak,best,rows,avg:rows.length?base/rows.length:0};
}
const curRound=s=>((s.rounds||{})[s.n])||{};

/* ---------- private choice -> commit -> reveal ---------- */
async function lockIn(){
  const s=sess(); if(!s||S.sel==null||(Array.isArray(S.sel)&&S.sel.length<4)) return;
  const n=s.n, val=S.sel, v=JSON.stringify(val), salt=rid(12); S.myPick={key:s.sid+"_"+n,val};
  const h=await sha([s.sid,n,v,salt].join("|"));
  await priv.child("pick").set({sid:s.sid,n,v,salt});
  await pub.child("session/rounds/"+n+"/commit/"+S.seat).set(h); Bot.think();
}
const statted={};
function react(){
  announce(false);
  if(S.env==="s"&&S.seat&&!Bot.on&&LS.get("us.bot."+S.id)){ const o=seats()[other()]; if(!o||o.bot) Bot.start(); }
  const s=sess(); if(!s||!S.seat||s.game!=="samebrain"||!s.plan) return;
  const key=s.sid+"_"+s.n;
  if(S.selKey!==key){ S.selKey=key; const p=s.plan[s.n]; S.sel=!p?null:p.f==="mid"?50:p.f==="rank"?[]:null; }
  if(s.n>=s.plan.length){
    if(!statted[s.sid]){ statted[s.sid]=true; const f=sbFold(s);
      pub.child("stats/samebrain").transaction(cur=>{ cur=cur||{}; if(cur.lastSid===s.sid) return;
        return {games:(cur.games||0)+1,bestScore:Math.max(cur.bestScore||0,f.score),bestStreak:Math.max(cur.bestStreak||0,f.best),prevBest:cur.bestScore||0,lastSid:s.sid}; }); }
    return; }
  const r=curRound(s), c=r.commit||{}, v=r.reveal||{}, n=s.n, p=s.plan[n];
  if(c.a&&c.b&&!v[S.seat]&&!revealing){ revealing=true;
    priv.child("pick").once("value").then(x=>{ const pk=x.val();
      if(pk&&pk.sid===s.sid&&pk.n===n) return pub.child("session/rounds/"+n+"/reveal/"+S.seat).set({v:pk.v,salt:pk.salt}); })
    .catch(e=>console.error(e)).finally(()=>{revealing=false}); }
  if(v.a&&v.b){
    if(S.verified[key]===undefined){ S.verified[key]=null;
      Promise.all(["a","b"].map(x=>sha([s.sid,n,v[x].v,v[x].salt].join("|")))).then(hs=>{ S.verified[key]=hs[0]===c.a&&hs[1]===c.b; render(); }); }
    if(s.host===S.seat&&!signalled[key]){ signalled[key]=true; const x=sbScore(p,JSON.parse(v.a.v),JSON.parse(v.b.v));
      pub.child("signals/"+key).set({game:"samebrain",owner:"shared",vis:"shared",t:TS,retired:false,data:{fmt:p.f,ref:p.i,a:v.a.v,b:v.b.v,pts:x.pts,sync:x.sync}}); }
  }
}
function nextRound(){ const s=sess(); if(s) pub.child("session/n").set(s.n+1); }

/* ---------- start fresh: always available, never leaves you stuck ---------- */
async function startFresh(){
  S.confirmFresh=false;
  try{ if(pub&&S.pub){ const ss=seats(), o=S.seat?ss[other()]:null, empty=!ss.a&&!ss.b;
    if(S.env==="s"){ await Bot.stop(); await priv.remove(); await pub.remove(); }          /* sandbox: delete it all */
    else if(empty||(S.seat&&!o)){ await priv.remove(); await pub.remove(); }                 /* real one nobody else joined: delete */
    else if(S.seat){ await pub.child("presence/"+S.seat).remove(); } } }catch(e){ console.error(e); }  /* shared real one: just leave on this phone */
  LS.del("us.home.u"); LS.del("us.home.s"); leaveUniverse();
}

/* ---------- test player (sandbox only): a second signed-in identity run from this phone ---------- */
const Bot={on:false,seat:null,uid:null,pub:null,priv:null,last:null,busy:false,showing:false,
  async start(){
    if(S.env!=="s"||this.on||!S.seat) return; const o=seats()[other()]; if(o&&!o.bot) return toast("Someone already joined");
    this.on=true; this.seat=other(); LS.set("us.bot."+S.id,1);
    try{
      const app=firebase.apps.find(a=>a.name==="bot")||firebase.initializeApp(window.FIREBASE_CONFIG,"bot");
      this.uid=(await app.auth().signInAnonymously()).user.uid;
      const r=app.database().ref("sandbox/"+S.id); this.pub=r.child("pub"); this.priv=r.child("priv/"+this.uid);
      await this.pub.child("seats/"+this.seat).set({uid:this.uid,name:"Test Player",av:"🤖",bot:true});
      const pr=this.pub.child("presence/"+this.seat); pr.onDisconnect().remove(); pr.set({uid:this.uid,t:TS});
      this.pub.on("value",x=>{ this.last=x.val(); this.think(); });
    }catch(e){ console.error(e); this.on=false; toast("Couldn't add the test player"); }
  },
  async stop(){
    if(!this.on) return; this.on=false; LS.del("us.bot."+S.id);
    try{ this.pub.off(); await this.priv.remove(); await this.pub.child("presence/"+this.seat).remove(); await this.pub.child("seats/"+this.seat).remove(); }catch(e){ console.error(e); }
  },
  think(){
    const pubv=this.last, s=pubv&&pubv.session; if(!this.on||!s||s.game!=="samebrain"||!s.plan||s.n>=s.plan.length) return;
    const n=s.n, r=((s.rounds||{})[n])||{}, c=r.commit||{}, v=r.reveal||{}, key=s.sid+"_"+n, p=s.plan[n], mirror=!!LS.get("us.bot.mirror");
    if(!c[this.seat]&&!this.busy&&!(mirror&&!c[S.seat])){ this.busy=true;
      setTimeout(async()=>{ try{ const now=this.last&&this.last.session, nr=now&&((now.rounds||{})[n]||{});
          if(this.on&&now&&now.sid===s.sid&&now.n===n&&!(nr.commit||{})[this.seat]){
            let val; if(mirror&&S.myPick&&S.myPick.key===key) val=S.myPick.val;
            else val=p.f==="snap"?Math.floor(Math.random()*9):p.f==="mid"?15+Math.floor(Math.random()*71):shuffle([0,1,2,3]);
            const vs=JSON.stringify(val), salt=rid(12), h=await sha([s.sid,n,vs,salt].join("|"));
            await this.priv.child("pick").set({sid:s.sid,n,v:vs,salt}); await this.pub.child("session/rounds/"+n+"/commit/"+this.seat).set(h); }
        }catch(e){ console.error(e); } this.busy=false; this.think(); }, mirror?400:1200+Math.random()*1800); }
    if(c.a&&c.b&&!v[this.seat]&&this.showing!==key){ this.showing=key;
      this.priv.child("pick").once("value").then(x=>{ const pk=x.val();
        if(pk&&pk.sid===s.sid&&pk.n===n) return this.pub.child("session/rounds/"+n+"/reveal/"+this.seat).set({v:pk.v,salt:pk.salt}); }).catch(e=>console.error(e)); }
  }
};

function renderSameBrain(s,me,o,oOn){

      <div><small>${on}</small>${theirs.map((it,k)=>`<div class="row ${it===mine[k]?"hit":""}"><i>${k+1}</i>${esc(d.o[it])}</div>`).join("")}</div></div>`;

    else{ const sel=S.sel||[]; ready=sel.length===4; ui=`<div class="rk">${d.o.map((t,i)=>{ const k=sel.indexOf(i); return `<button class="rki ${k>=0?"sel":""}" data-act="rk" data-v="${i}"><i>${k>=0?k+1:""}</i>${esc(t)}</button>`; }).join("")}</div><p class="note">Tap them in order, first to last. Tap again to undo.</p>`; }

     leave:leaveUniverse,
     reclaim:()=>reclaim(el.dataset.seat),
     av:()=>{ S.av=el.dataset.av; document.querySelectorAll(".avs button").forEach(b=>b.classList.toggle("sel",b.dataset.av===S.av)); },
     saveprofile:()=>saveProfile($("#name").value,S.av),
     launch:()=>launch(el.dataset.game),
     sheet:()=>{S.sheet=true;render()}, closesheet:()=>{S.sheet=false;render()},
     edit:()=>{S.sheet=false;S.draftName=null;S.editing=true;render()},
     share:()=>{ const url=inviteURL(); S.sheet=false; render();
       if(navigator.share) navigator.share({title:"US",url}).catch(()=>{}); else if(navigator.clipboard) navigator.clipboard.writeText(url).then(()=>toast("Link copied")); },
     addbot:()=>{ S.sheet=false; Bot.start(); render(); }, rmbot:()=>{ S.sheet=false; Bot.stop(); },
     fresh:()=>{ S.sheet=false; S.confirmFresh=true; render(); }, cancelfresh:()=>{ S.confirmFresh=false; render(); }, freshyes:startFresh,
     back:()=>{ if(S.editing){ S.editing=false; S.draftName=null; render(); } else startFresh(); },
     sel:()=>{ S.sel=+el.dataset.v; render(); },
     rk:()=>{ const v=+el.dataset.v, a=(S.sel||[]).slice(), k=a.indexOf(v); if(k>=0) a.splice(k,1); else a.push(v); S.sel=a; render(); },
     lock:lockIn, next:nextRound, rematch:()=>launch("samebrain"),
     mirror:()=>{ LS.set("us.bot.mirror",LS.get("us.bot.mirror")?0:1); render(); },
     end:()=>{ const s=sess(); if(s&&s.plan&&s.n<s.plan.length){S.confirmEnd=true;render()} else endSession(); },
     endyes:endSession, cancelend:()=>{S.confirmEnd=false;render()}
  }[a]||(()=>{}))();
});
document.addEventListener("input",e=>{ if(e.target.id==="mid") S.sel=+e.target.value; });
document.addEventListener("pointerdown",e=>{ if(e.target.id==="mid") S.dragging=true; });
["pointerup","pointercancel","touchend"].forEach(ev=>document.addEventListener(ev,()=>{ if(S.dragging){ S.dragging=false; render(); } }));
boot();
</script>
</body>
</html>
