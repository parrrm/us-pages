<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>US · After Dark</title>
<style>
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0} [hidden]{display:none!important} img{max-width:100%}
.coderow code{font-size:14px!important;font-weight:600!important;font-family:var(--body)!important}

/* Layout: compact sticky game header with a ⋯ menu, one card stage that turns into a chat once both have answered. Single deliberate late-night look. */
:root{
  --bg:#160a11; --bg2:#22101b; --card:#2d1424; --line:#4a2639;
  --ink:#fbefea; --muted:#dcc0c8; --rose:#ff5b7a; --ember:#ffb08a; --ok:#7fd8b0;
  --me:#5a1f39; --them:#3a1a2c;
  --display:"Fraunces",Georgia,"Times New Roman",serif;
  --body:"DM Sans",system-ui,-apple-system,"Segoe UI",sans-serif; --ts:1;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:radial-gradient(120% 70% at 50% -10%,var(--glowc) 0%,var(--bg) 60%) fixed,var(--bg);color:var(--ink);font-family:var(--body);font-size:calc(16px*var(--ts));line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 32px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h1{font-family:var(--display);font-style:italic;font-weight:700;font-size:clamp(40px,11vw,60px);line-height:.95;margin:0;letter-spacing:-.01em}
h1 span{color:var(--rose)}
.sub{color:var(--muted);margin:6px 0 0;max-width:46ch}
.panel{background:var(--bg2);border:1px solid var(--line);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:12px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:420px){.row{grid-template-columns:1fr}}
.col{display:flex;flex-direction:column;gap:8px;min-width:0}
label,.lbl{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
input,select,textarea{width:100%;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font:inherit}
textarea{min-height:92px;resize:vertical;line-height:1.45}
textarea:disabled{opacity:.45}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--rose);outline-offset:2px}
button{font:inherit;cursor:pointer;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:10px 16px;font-weight:600}
button:disabled{opacity:.4;cursor:not-allowed}
button.primary{background:linear-gradient(135deg,var(--rose),var(--ember));border:0;color:#200813;padding:13px 20px;font-size:16px}
button.ghost{background:transparent}
.note{font-size:13px;color:var(--muted);margin:0}
.err{font-size:13px;color:var(--ember);margin:0}
.who{display:flex;flex-direction:column;gap:6px}
.who div{display:flex;justify-content:space-between;gap:8px;padding:8px 12px;border-radius:10px;background:var(--card)}
.who .on{color:var(--ok)}
/* game header */
.ghead{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:#160a11d9;-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);padding:8px 16px;margin:-8px -16px 0;border-radius:0 0 16px 16px;display:flex;flex-direction:column;gap:8px}
.gtop{display:flex;justify-content:space-between;align-items:baseline;gap:10px}.gtop .meta{font-size:13px}

.heatname{font-family:var(--display);font-style:italic;font-size:20px;color:var(--ember)}
.ladder{display:flex;gap:4px}
.ladder i{flex:1;height:6px;border-radius:3px;background:var(--line)}
.ladder i.lit{background:linear-gradient(90deg,var(--ember),var(--rose))}
.ladder i.cap{opacity:.25}
.meta{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
/* card */
.card{background:linear-gradient(160deg,var(--card),#1d0c17);border:1px solid var(--line);border-radius:24px;padding:22px 20px;display:flex;flex-direction:column;gap:14px;box-shadow:0 30px 60px -30px #000}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.kind{display:inline-flex;gap:8px;align-items:center;font-size:11px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;padding:5px 10px;border-radius:999px;background:#ff5b7a22;color:var(--rose)}
.kind.alt{background:#ffb08a22;color:var(--ember)}
.owner{font-size:13px;color:var(--muted)}
.owner b{color:var(--ink)}
.text{font-family:var(--display);font-weight:600;font-size:calc(clamp(22px,6vw,26px)*var(--ts));line-height:1.35;margin:0;text-wrap:pretty;letter-spacing:-.005em}
.text em{color:var(--rose);font-style:italic}
.banner{font-size:14px;padding:10px 12px;border-radius:12px;background:#ffb08a1c;color:var(--ember)}
.opts{display:grid;gap:8px}
.opts button{text-align:left;border-radius:14px;font-weight:500;padding:12px 14px;font-size:calc(16px*var(--ts))}
.opts button.pick{border-color:var(--rose);background:#ff5b7a2b}
.follow{font-size:calc(18px*var(--ts));font-weight:600;line-height:1.4}
.compose{display:flex;flex-direction:column;gap:8px}
.timer{display:flex;align-items:center;gap:12px}
.timer .t{font-variant-numeric:tabular-nums;font-size:28px;font-family:var(--display);color:var(--ember);min-width:3ch}
.thread{display:flex;flex-direction:column;gap:8px}
.msg{max-width:88%;padding:10px 13px;font-size:calc(16px*var(--ts));border-radius:16px;background:var(--them);white-space:pre-wrap;overflow-wrap:anywhere}
.msg.mine{align-self:flex-end;background:var(--me)}
.msg small{display:block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:2px}
.msg .pickline{font-weight:700;color:var(--ember)}
.fu{display:flex;flex-direction:column;gap:8px;padding:12px 14px;border:1px dashed #ffb08a66;border-radius:14px}
.fu .kind{align-self:flex-start}
.fu .follow{margin:0}
.levelup{align-self:center;font-size:13px;letter-spacing:.06em;color:var(--ember);background:#ffb08a1a;border:1px solid #ffb08a40;padding:6px 14px;border-radius:999px;text-align:center}


.heatsum{display:flex;gap:12px;align-items:center;padding:12px;border-radius:14px;background:#ff5b7a14;font-size:14px}
.cd.word{font-size:52px;font-style:italic}
.cd{font-family:var(--display);font-size:96px;line-height:1;text-align:center;color:var(--rose);font-variant-numeric:tabular-nums;padding-block:8px}
.coderow{display:flex;gap:8px;align-items:center}.coderow code{flex:1;min-width:0;font-size:16px;font-weight:700;padding:10px 12px;border-radius:10px;background:var(--card);color:var(--ember);overflow-wrap:anywhere;user-select:all}
details summary{cursor:pointer}
.tbar{flex:1;height:10px;border-radius:5px;background:var(--line);overflow:hidden}.tbar i{display:block;height:100%;background:linear-gradient(90deg,#f3c6b1,#ff5b7a,#e8204f)}
.bub{position:relative;max-width:82%;padding:9px 13px;border-radius:20px;font-size:calc(16px*var(--ts));line-height:1.4;overflow-wrap:anywhere}
.bub.them{align-self:flex-start;background:#3a2234;border-bottom-left-radius:6px}
.bub.me{align-self:flex-end;background:linear-gradient(135deg,#ff5b7a,#e8366a);color:#fff;border-bottom-right-radius:6px}
.bub .quote{font-size:12.5px;opacity:.75;border:0;padding:0 0 4px;margin:0}
.bub.typing{padding:12px 14px}
.composer{display:flex;gap:8px;align-items:center;background:#ffffff0d;border:1px solid var(--line);border-radius:999px;padding:4px 4px 4px 14px}
.composer input{flex:1;min-width:0;border:0;background:transparent;padding:8px 0}.composer input:focus{outline:none}
.composer button{flex:none;width:38px;height:38px;padding:0;border-radius:50%;border:0;background:linear-gradient(135deg,#ff5b7a,#ffb08a);color:#200813;font-size:16px}
.quote{font-size:13px;color:var(--muted);border-left:3px solid var(--rose);padding-left:8px;margin-bottom:4px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}.chips button{flex:none;padding:7px 12px;font-size:13px;font-weight:500}
.replying{display:flex;gap:8px;align-items:center;justify-content:space-between;font-size:13px;color:var(--muted);background:#ff5b7a14;padding:6px 10px;border-radius:10px}
.replying span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.replying button{padding:2px 10px}
.readyrow{display:flex;flex-direction:column;gap:8px}
.tsrow{display:flex;gap:8px;align-items:center}.tsrow .lbl{flex:1}
.fx{position:fixed;inset:0;pointer-events:none;z-index:50;overflow:hidden}
.fxphrase{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%);width:min(86vw,440px);text-align:center;display:flex;flex-direction:column;gap:6px;align-items:center;
  font-family:var(--display);font-weight:700;font-size:25px;line-height:1.3;color:#fff;background:transparent;border:0!important;box-shadow:none!important;border:1px solid #ff5b7a66;border-radius:22px;padding:18px 20px 20px;box-shadow:0 20px 60px -10px #000;animation:fxin 3.9s ease forwards}
.fxphrase b{font-size:96px;line-height:1;display:block;animation:pop .8s ease both}
.fxphrase small{font-family:var(--body);font-size:13px;font-weight:600;letter-spacing:.06em;color:var(--ember);margin-top:4px}
@keyframes pop{0%{transform:scale(.6);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes fxin{0%{opacity:0;transform:translate(-50%,-40%) scale(.85)}15%{opacity:1;transform:translate(-50%,-50%) scale(1)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-56%)}}
@keyframes fxfade{0%{opacity:0}15%{opacity:1}75%{opacity:1}100%{opacity:0}}
.fx .pt{position:absolute;bottom:-40px;font-style:normal;z-index:1;animation:rise 3.6s ease-out forwards}
@keyframes rise{0%{transform:translate(0,0);opacity:0}15%{opacity:.95}80%{opacity:.8}100%{transform:translate(var(--dx,0),-100vh);opacity:0}}
@media (prefers-reduced-motion:reduce){.fx,.fxphrase{animation-duration:.01s!important}.fxphrase{animation:fxfade 2.5s linear forwards!important}}
.result{font-weight:700;font-size:17px;text-align:center}
.result.hit{color:var(--ok)}.result.miss{color:var(--ember)}
.wait{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:14px}
.dots{display:inline-flex;gap:3px}.dots i{width:6px;height:6px;border-radius:50%;background:var(--rose);animation:b 1.2s infinite}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes b{0%,60%,100%{opacity:.25}30%{opacity:1}}
@media (prefers-reduced-motion:reduce){.dots i{animation:none;opacity:.7}}
.stack{display:flex;flex-direction:column;gap:8px}
.big{font-family:var(--display);font-weight:700;font-size:28px;margin:0;line-height:1.1;text-wrap:balance}
.handoff{text-align:center;align-items:center;padding-block:40px}
.scene{margin:-22px -20px 0;height:clamp(180px,52vw,250px);border-radius:24px 24px 0 0;overflow:hidden;position:relative;transition:opacity .4s ease,filter .4s ease;background:#050203}
.scene svg{display:block;width:100%;height:100%}
.scene::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 60%,#1d0c17 100%);pointer-events:none}
.card:focus-within .scene{opacity:.4;filter:blur(1px)}
.backdrop{position:fixed;inset:-40px;z-index:0;pointer-events:none;opacity:.55;transition:opacity 1s ease}
.backdrop .bdsc{width:100%;height:100%;filter:blur(26px) brightness(.55) saturate(1.2)}
.backdrop .bdsc svg{width:100%;height:100%;display:block}

.vig{position:fixed;inset:0;pointer-events:none;z-index:0;background:radial-gradient(130% 90% at 50% 40%,transparent 45%,#000 100%);opacity:var(--vig,0);transition:opacity 2s ease}
.wrap{position:relative;z-index:1}
body{--glowc:#3a1328;--vig:0}
body[data-lv="1"]{--glowc:#3a1836;--vig:.15} body[data-lv="2"]{--glowc:#4a1530;--vig:.3} body[data-lv="3"]{--glowc:#5a1226;--vig:.45}
body[data-lv="4"]{--glowc:#6a0f20;--vig:.6} body[data-lv="5"]{--glowc:#7a0b1a;--vig:.72} body[data-lv="f"]{--glowc:#3a1f2a;--vig:.25}
.card{position:relative}
.card.flip{animation:cflip 1.3s ease both;animation-delay:var(--fd,0s)}
.card.flip::before{content:"After Dark";position:absolute;inset:-1px;z-index:4;border-radius:24px;display:grid;place-items:center;font-family:var(--display);font-style:italic;font-weight:700;font-size:34px;color:var(--rose);
  background:radial-gradient(circle at 50% 50%,#3a1328,transparent 70%),repeating-linear-gradient(45deg,#2d1424 0 10px,#24101c 10px 20px);border:1px solid var(--line);animation:cback 1.3s linear both;animation-delay:var(--fd,0s)}
@keyframes cflip{0%,35%{transform:perspective(1000px) rotateY(0)}50%{transform:perspective(1000px) rotateY(90deg)}50.01%{transform:perspective(1000px) rotateY(-90deg)}68%,100%{transform:perspective(1000px) rotateY(0)}}
@keyframes cback{0%,49.9%{opacity:1}50%,100%{opacity:0;visibility:hidden}}
@media (prefers-reduced-motion:reduce){.card.flip{animation:none}.card.flip::before{display:none}}
.card.gold{border-color:#e8b75a;box-shadow:0 0 0 1px #e8b75a55,0 30px 60px -30px #000,0 0 40px -10px #e8b75a66}
.kind.gold{background:linear-gradient(135deg,#e8b75a33,#ffdf9a22);color:#f3cf7a}
.tease{display:flex;flex-direction:column;gap:6px;padding:12px 14px;border-radius:14px;background:#ff5b7a12;border:1px dashed #ff5b7a55}
.tease p{margin:0;font-family:var(--display);font-weight:600;font-size:calc(19px*var(--ts));line-height:1.35}
.tease .blur{filter:blur(3.5px);user-select:none}
.best{display:flex;flex-direction:column;gap:10px}
.best .msg{opacity:0;animation:bestin .8s ease forwards;max-width:100%}
.best .msg small b{color:var(--rose)}
@keyframes bestin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.best .msg{animation:none;opacity:1}}

/* ---- stages ---- */
.gr{display:flex;gap:10px;align-items:center}
.menu{width:34px;height:30px;padding:0;border-radius:10px;font-size:18px;line-height:1;background:transparent;border-color:#ffffff22}
#app.stagein{animation:stin .7s ease both}
@keyframes stin{from{filter:blur(12px);opacity:.35;transform:translateY(6px)}to{filter:none;opacity:1;transform:none}}
.backdrop.bdpulse .bdsc{animation:bdp 1s ease both}
@keyframes bdp{0%{filter:blur(26px) brightness(.55) saturate(1.2)}35%{filter:blur(48px) brightness(.32) saturate(1.4)}100%{filter:blur(26px) brightness(.55) saturate(1.2)}}
@media (prefers-reduced-motion:reduce){#app.stagein,.backdrop.bdpulse .bdsc{animation:none}}
.card.talkmode{gap:12px}
.card.talkmode .scene{height:clamp(84px,24vw,112px)}
.card.talkmode .text{font-size:calc(18px*var(--ts));line-height:1.35}
.card.talkmode .owner{display:none}
/* ---- gestures ---- */
.gest{touch-action:pan-y;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;transition:transform .18s ease,box-shadow .2s ease;position:relative}
.gest.pressed{transform:scale(.97)}
.gest.swready::after{content:"↩";position:absolute;right:-30px;top:50%;transform:translateY(-50%);font-size:18px;color:var(--rose)}
.rxline{display:flex;gap:10px;align-items:center;font-size:14px;color:var(--muted);padding:8px 12px;border-radius:14px;background:#ffffff08;border:1px dashed #ffffff1f}
.rxline b{font-size:22px;line-height:1;letter-spacing:2px}
.bub .rxb{position:absolute;bottom:-10px;font-style:normal;font-size:15px;background:var(--bg2);border:1px solid var(--line);border-radius:999px;padding:0 6px;line-height:20px}
.bub.them .rxb{right:-6px}.bub.me .rxb{left:-6px}
.chips{flex-wrap:wrap;overflow:visible;padding:2px 0 4px}
.chips button{border-radius:999px;background:#ffffff0b;border-color:#ffffff22;color:var(--ink)}
.chips button.card{background:#ff5b7a1f;border-color:#ff5b7a66}
.chips button.kw{background:#ffb08a1c;border-color:#ffb08a66}
.chips button.rx{background:#e8b75a24;border-color:#e8b75a88}
.chips button.mine{border-style:dashed}
.composer{padding-left:4px}
/* ---- reaction picker ---- */
#ad-rxp{position:fixed;inset:0;z-index:60}
.rxbg{position:absolute;inset:0;background:#0b040899;-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
.rxpop{position:absolute;display:flex;flex-direction:column;gap:8px;padding:12px;border-radius:22px;background:linear-gradient(160deg,#3a1630,#22101b);border:1px solid #ff5b7a66;box-shadow:0 20px 50px -10px #000}
.rxt{font-family:var(--display);font-weight:700;font-size:16px;text-align:center}
.rxrow{display:grid;grid-template-columns:repeat(auto-fit,minmax(46px,1fr));gap:4px}
.rxrow button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 0 6px;border:0;background:transparent;border-radius:14px;font-size:10.5px;font-weight:600;color:var(--muted);animation:rxin .28s ease both;animation-delay:calc(var(--i)*35ms)}
.rxrow button b{font-size:30px;line-height:1;transition:transform .12s ease}
.rxrow button.hov b,.rxrow button:hover b{transform:scale(1.35) translateY(-4px)}
.rxrow button.pick{background:#ff5b7a33;color:var(--ink)}
@keyframes rxin{from{opacity:0;transform:translateY(10px) scale(.6)}to{opacity:1;transform:none}}
/* ---- sheets ---- */
#ad-sheet{position:fixed;inset:0;z-index:55}
.shbg{position:absolute;inset:0;background:#0b0408b3}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:82vh;overflow:auto;max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:10px;
  padding:10px max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));background:var(--bg2);border:1px solid var(--line);border-bottom:0;border-radius:22px 22px 0 0;animation:shin .25s ease both}
@keyframes shin{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.sheet .grab{align-self:center;width:40px;height:4px;border-radius:2px;background:#ffffff33}
.shh{font-family:var(--display);font-weight:700;font-size:20px;margin-top:4px}
.mi{text-align:left;border-radius:14px;padding:13px 14px;background:#ffffff08}
.mylist{display:flex;flex-direction:column;gap:6px}.mylist div{display:flex;gap:8px;align-items:center;justify-content:space-between;padding:8px 6px 8px 12px;border-radius:12px;background:#ffffff08}
.mylist span{min-width:0;overflow-wrap:anywhere}.mylist button{flex:none;padding:4px 10px;background:transparent;border:0;color:var(--muted)}
.unk{display:flex;flex-wrap:wrap;gap:6px}.unk span{padding:5px 10px;border-radius:999px;background:#ffffff0d;font-size:14px}.unk i{font-style:normal;color:var(--muted);font-size:11px;margin-left:6px}
/* ---- effects ---- */
.fxphrase.mini{top:22%;font-size:18px;animation:fxin 2.6s ease forwards}.fxphrase.mini b{font-size:56px}
.fxphrase.mini span{background:#22101be6;border:1px solid #ff5b7a55;border-radius:999px;padding:6px 14px}
.fxphrase.mini small{background:#22101be6;border-radius:999px;padding:3px 10px}
.score{display:flex;flex-direction:column;gap:6px;padding:12px 14px;border-radius:14px;background:#ff5b7a14;font-size:15px}

.emok{display:flex;flex-wrap:wrap;gap:6px}
.emok button{display:flex;align-items:center;gap:5px;padding:6px 10px;border-radius:12px;background:#ffffff0b;font-size:12px;font-weight:600;color:var(--muted)}
.emok button b{font-size:20px;line-height:1}

/* ---- floating chat ---- */
body{padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}
.fx{z-index:58}
#ad-fab{position:fixed;right:calc(16px + env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:45;width:58px;height:58px;padding:0;border-radius:50%;
  display:grid;place-items:center;color:#fff;background:linear-gradient(145deg,var(--rose),#c2365a);border:0;box-shadow:0 10px 28px -6px #ff5b7a99,0 0 0 1px #ffffff1a inset}
#ad-fab svg{width:26px;height:26px}
#ad-fab .badge{position:absolute;top:-2px;right:-2px;min-width:22px;height:22px;padding:0 6px;border-radius:11px;background:#fff;color:#b8284f;font-size:12px;font-weight:800;line-height:22px;text-align:center}
#ad-fab .tdot{position:absolute;top:2px;right:2px;width:12px;height:12px;border-radius:50%;background:#fff;animation:b 1.2s infinite}

function sendMsg(text){ const t=String(text||"").trim(); if(!t||!G) return; chMerge();

  replyTo=null; mine.ty=null; CH[myId+":"+i]=Object.assign({a:myId},m); chSeen[myId+":"+i]=1; chSave();
  const cur=(P[myId]&&P[myId].cm&&P[myId].cm.m)||[]; setMine({cm:{m:cur.concat([m]).slice(-12)},ty:null}); }
/* Floating chat: one button, one panel. */
function chatOn(){ return mode==="net"&&G&&G.ph&&G.ph!=="lobby"&&G.pl&&G.pl.length===2; }
function renderChat(force){
  const fab=document.getElementById("ad-fab"), pan=document.getElementById("ad-chat"); if(!fab||!pan) return;
  if(!chatOn()){ fab.hidden=true; pan.hidden=true; chOpen=false; return; }
  const o=other(myId), N=nameOf(o), list=allChat(), typing=!!(P[o]&&P[o].ty==="c");
  if(chOpen) list.forEach(m=>{ if(m.a!==myId) chSeen[m.a+":"+m.i]=1; });
  const unread=list.filter(m=>m.a!==myId&&!chSeen[m.a+":"+m.i]);
  fab.hidden=chOpen; const bd=fab.querySelector(".badge"); bd.hidden=!unread.length; bd.textContent=unread.length>9?"9+":unread.length; fab.querySelector(".tdot").hidden=!typing||!!unread.length;
  // preview of a new message while the panel is closed
  const nw=unread[unread.length-1];
  if(!chOpen&&nw&&Date.now()-nw.s<15000&&renderChat.last!==nw.a+":"+nw.i){ renderChat.last=nw.a+":"+nw.i; const tt=document.getElementById("ad-toast");
    tt.innerHTML=`<b>${esc(N)}</b><span>${esc(nw.t)}</span>`; tt.hidden=false; tt.classList.remove("in"); void tt.offsetWidth; tt.classList.add("in"); clearTimeout(toastT); toastT=setTimeout(()=>{ tt.hidden=true; },3800); }
  pan.hidden=!chOpen; if(!chOpen){ chSave(); return; }
  chSave();
  document.getElementById("chname").textContent=N; document.getElementById("chstat").textContent=typing?"typing…":"";
  const inp=document.getElementById("cmt"); if(inp&&!inp.placeholder) inp.placeholder=`Message ${N}…`;
  let h="", lastK=null;
  list.forEach(m=>{ if(m.k!==lastK){ lastK=m.k; h+=`<div class="chdiv"><span>${esc(CT[m.k]||"Earlier")}</span></div>`; } h+=msgBubble(m); });
  if(!list.length) h+=`<p class="chempty">Say something to ${esc(N)}. Swipe a message left to reply to it, hold it to react.</p>`;
  if(typing) h+=`<div class="bub them typing"><span class="dots"><i></i><i></i><i></i></span></div>`;
  const rq=replyTo&&quoteOf(replyTo);
  const rep=rq?`<div class="replying"><span>↪ ${esc(rq.slice(0,60))}</span><button id="cmtx" type="button" aria-label="Cancel reply">✕</button></div>`:"";
  let ch=""; try{ ch=chips().map(([t,cl])=>`<button type="button" data-chip="${esc(t)}" class="${cl}">${cl==="mine"?"★ ":""}${esc(t)}</button>`).join(""); }catch(e){}
  const sg=h+"|"+rep+"|"+ch; if(sg===chSig&&!force) return; chSig=sg;
  const el=document.getElementById("chlist"), near=force||el.scrollHeight-el.scrollTop-el.clientHeight<80;
  el.innerHTML=h; document.getElementById("chrep").innerHTML=rep; document.getElementById("chchips").innerHTML=ch;
  if(near) el.scrollTop=el.scrollHeight;
  const cx=document.getElementById("cmtx"); if(cx) cx.onclick=()=>{ replyTo=null; renderChat(true); };
  document.querySelectorAll("#chchips [data-chip]").forEach(b=>{ b.onpointerdown=e=>e.preventDefault(); b.onclick=()=>{ sendMsg(b.dataset.chip); renderChat(true); }; });
}
(function chatInit(){

function sheetHTML(){
  if(!sheet||!G||G.ph==="lobby") return "";
  let h=`<div class="shbg" data-shx></div><div class="sheet" role="dialog" aria-label="Menu"><i class="grab"></i>`;

    h+=`${canSkip?`<button class="mi" id="m-skip">⏭ Skip this card</button>`:""}<button class="mi" id="m-pause" ${G.ph==="pause"?"disabled":""}>⏸ Pause</button>${G.ph==="card"||G.ph==="check"||G.ph==="tell"?`<button class="mi" id="m-bed">🌙 Take me to bed</button>`:""}
     <button class="mi" id="m-mine">★ My quick replies</button><button class="mi" id="m-unk">✎ Words to teach the game</button>
     <div class="tsrow"><span class="lbl">Text size</span><button id="tsm2" aria-label="Smaller text">A–</button><button id="tsp2" aria-label="Bigger text">A+</button></div>`; }
  else if(sheet==="mine"){ const my=myReplies();
    h+=`<div class="shh">My quick replies</div><p class="note">Saved on this phone. One shows up in your suggestions, marked ★.</p><div class="mylist">${my.map((t,i)=>`<div><span>${esc(t)}</span><button data-mydel="${i}" aria-label="Delete">✕</button></div>`).join("")||`<p class="note">None yet.</p>`}</div>
      <div class="composer"><input id="myin" maxlength="120" placeholder="Add a reply…" autocomplete="off"><button id="myadd" aria-label="Add">＋</button></div>`; }

  return h+`<button class="ghost" data-shx>Close</button></div>`;

function renderSheet(){

  on("#myadd",add); const mi=el.querySelector("#myin"); if(mi) mi.onkeydown=e=>{ if(e.key==="Enter"){ e.preventDefault(); add(); } };
  on("#unkcopy",()=>{ let u={}; try{u=JSON.parse(localStorage.getItem("ad-unk")||"{}")}catch(e){} copyText(Object.keys(u).sort((a,b)=>u[b]-u[a]).join(", "),"unk"); setTimeout(renderSheet,0); setTimeout(renderSheet,2600); });
  on("#unkclr",()=>{ try{localStorage.removeItem("ad-unk")}catch(e){} renderSheet(); });

/* Hold a bubble to react; swipe it left to reply. */
function openRx(tg,x,y){ if(!G||mode!=="net")return; rxp={tg,x,y}; renderRxp(); try{navigator.vibrate&&navigator.vibrate(12)}catch(e){} }

document.addEventListener("pointerdown",ev=>{
  const t=ev.target; if(!t.closest) return;

    t:tg?setTimeout(()=>{ if(gest&&!gest.sw){ gest.held=true; const el=gEl(gest); if(el)el.classList.add("pressed"); openRx(tg,gest.x,gest.y); } },380):0};
});
document.addEventListener("pointermove",ev=>{ if(!gest) return; const dx=ev.clientX-gest.x, dy=ev.clientY-gest.y;
  if(gest.held){ const h=document.elementFromPoint(ev.clientX,ev.clientY), btn=h&&h.closest&&h.closest("[data-pe]");

  if(!gest.sw){ if(Math.abs(dy)>12&&Math.abs(dy)>Math.abs(dx)){ clearTimeout(gest.t); gest=null; return; }
    if(dx<-12&&Math.abs(dx)>Math.abs(dy)*1.2&&gest.rp){ gest.sw=true; clearTimeout(gest.t); } else if(Math.abs(dx)>12){ clearTimeout(gest.t); } }
  if(gest&&gest.sw){ gest.dx=Math.max(-90,Math.min(0,dx)); const el=gEl(gest); if(el){ el.style.transform=`translateX(${gest.dx}px)`; el.classList.toggle("swready",gest.dx<-56); } }
},{passive:true});
